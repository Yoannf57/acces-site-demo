<style>

<script src="fidaa-template.js"></script>
<script>
'use strict';
/* =====================================================================
   ACCÈS SITE — v3 (site de test)
   Tout est stocké sur le téléphone (IndexedDB). Aucun serveur.
   Les échanges se font par fichiers PDF qui contiennent aussi les données
   lisibles par l'app (bloc ACCESSITE intégré au PDF).
   La FIDAA est redessinée à l'identique du modèle officiel à partir de
   fidaa-template.js (généré par outils/extract_template.py).
   ===================================================================== */

/* ---------- Utilitaires ---------- */
const $ = s => document.querySelector(s);
const h = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso = d => new Date(d.getTime() - d.getTimezoneOffset()*60000).toISOString().slice(0,10);
const todayISO = () => iso(new Date());
const addDays = (n, base) => { const d = base ? new Date(base+'T12:00') : new Date(); d.setDate(d.getDate()+n); return iso(d); };
const fmtD = s => s ? String(s).slice(0,10).split('-').reverse().join('/') : '—';
const now = () => new Date().toLocaleString('fr-FR',{dateStyle:'short',timeStyle:'short'});
const nowISO = () => new Date().toISOString();
const hm = () => new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const clone = o => JSON.parse(JSON.stringify(o ?? null));
const empty = t => `<div class="empty">${t}</div>`;
const ini = (p,n) => h(((p||'?')[0] + (n||'?')[0]).toUpperCase());
const longDate = d => new Date(d+'T12:00').toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
const kb = n => n > 1e6 ? (n/1e6).toFixed(1)+' Mo' : Math.max(1,Math.round(n/1e3))+' Ko';
const safe = s => String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9._-]+/g,'_').replace(/^_+|_+$/g,'').slice(0,60) || 'sans_nom';
function getPath(o,p){ return p.split('.').reduce((a,k)=>a==null?undefined:a[k],o); }
function setPath(o,p,v){ const ks=p.split('.'); let a=o; ks.slice(0,-1).forEach(k=>{ if(a[k]==null||typeof a[k]!=='object') a[k]={}; a=a[k]; }); a[ks[ks.length-1]]=v; }
function siretOk(s){
  s=String(s).replace(/\s/g,''); if(!/^\d{14}$/.test(s)) return false;
  let sum=0; for(let i=0;i<14;i++){ let n=+s[13-i]; if(i%2){ n*=2; if(n>9) n-=9; } sum+=n; }
  return sum%10===0 || s.startsWith('356000000');
}
const withLuhn = b => { for(let d=0;d<10;d++) if(siretOk(b+d)) return (b+d).replace(/^(\d{3})(\d{3})(\d{3})(\d{5})$/,'$1 $2 $3 $4'); return b+'0'; };
function u8ToBin(u){ let s=''; for(let i=0;i<u.length;i+=0x8000) s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000)); return s; }
function binToU8(s){ const u=new Uint8Array(s.length); for(let i=0;i<s.length;i++) u[i]=s.charCodeAt(i)&255; return u; }
async function blobToB64(b){ return btoa(u8ToBin(new Uint8Array(await b.arrayBuffer()))); }
const b64ToBlob = (b64,type) => new Blob([binToU8(atob(b64))],{type});
const utf8ToB64 = s => btoa(u8ToBin(new TextEncoder().encode(s)));
const b64ToUtf8 = b => new TextDecoder().decode(binToU8(atob(b)));
function dl(blob,name){ const a=document.createElement('a'), url=URL.createObjectURL(blob); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),5000); }
async function hash(s){
  try{ const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('acces-site:'+s)); return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join(''); }
  catch(e){ let x=7; for(const c of 'acces-site:'+s) x=(x*31+c.charCodeAt(0))|0; return 'w'+x; }
}

/* ---------- Stockage local (IndexedDB, repli en mémoire) ---------- */
const Store = {
  db:null, mem:{kv:new Map(), files:new Map()},
  async open(){
    try{ this.db = await new Promise((res,rej)=>{ const r=indexedDB.open('acces-site-v2',1);
      r.onupgradeneeded=()=>{ r.result.createObjectStore('kv'); r.result.createObjectStore('files'); };
      r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
    catch(e){ this.db=null; }
  },
  _tx(store,mode,fn){ return new Promise((res,rej)=>{ const t=this.db.transaction(store,mode), q=fn(t.objectStore(store)); t.oncomplete=()=>res(q&&q.result); t.onerror=()=>rej(t.error); t.onabort=()=>rej(t.error); }); },
  get(st,k){ return this.db ? this._tx(st,'readonly',s=>s.get(k)) : Promise.resolve(this.mem[st].get(k)); },
  put(st,k,v){ return this.db ? this._tx(st,'readwrite',s=>s.put(v,k)) : Promise.resolve(this.mem[st].set(k,v)); },
  del(st,k){ return this.db ? this._tx(st,'readwrite',s=>s.delete(k)) : Promise.resolve(this.mem[st].delete(k)); },
  clear(){ return this.db ? Promise.all(['kv','files'].map(n=>this._tx(n,'readwrite',s=>s.clear()))) : Promise.resolve((this.mem.kv.clear(),this.mem.files.clear())); }
};
async function saveFile(id,blob,name){ await Store.put('files',id,{type:blob.type||'application/pdf',name:name||blob.name||id,buf:await blob.arrayBuffer()}); }
async function getFile(id){ if(!id) return null; const r=await Store.get('files',id); return r ? new File([r.buf], r.name, {type:r.type}) : null; }
const delFile = id => id ? Store.del('files',id).catch(()=>{}) : Promise.resolve();

const defaultS = () => ({role:null, company:null, ca:null, garde:null, settings:{pinHash:null, retention:180},
  employees:[], requests:[], dossiers:[], gate:[], log:[], seq:0, lastInter:null, hintDone:false});
let S = defaultS();
function persist(){ return Store.put('kv','S',clone(S)).catch(()=>toast('Enregistrement impossible sur cet appareil')); }
function requestPersist(){ try{ navigator.storage && navigator.storage.persist && navigator.storage.persist(); }catch(e){} }

/* ---------- Champs (FIDAA : alignés sur le modèle officiel ; Accès véhicule : provisoire) ---------- */
const VTYPES = ['Véhicule léger','Utilitaire','Poids lourd','Engin'];
const TIT = ['Notre société','Une autre société'];
const FD = {
  company:[['raison','Raison sociale',1],['siret','SIRET (14 chiffres)',1,'siret'],['adresse','Adresse (n°, rue)',1],['cp','Code postal',1],['ville','Ville',1],['pays','Pays',1],['tel','Téléphone',1,'tel'],['email','E-mail de la société',1,'email'],
    ['dirNom','Nom du représentant (signataire)',1],['dirPrenom','Prénom du représentant',1],['dirFonction','Fonction du représentant',1],['dirTel','Téléphone du représentant',0,'tel']],
  employee:[['nom','Nom / nom de jeune fille',1],['prenom','Prénom',1],['naissance','Date de naissance',1,'date'],['lieuNaissance','Lieu de naissance (département / pays)',1],['nationalite','Nationalité',1],['fonction','Métier',1],['tel','Téléphone',0,'tel']],
  empAddr:[['adresse','Adresse personnelle',0],['cp','Code postal',0],['ville','Ville',0],['pays','Pays',0]],
  empJob:[['dateEntree','Date d’entrée dans l’entreprise',0,'date'],['interim','Intérimaire',0,'check',null,1]],
  agence:[['raison','Agence d’intérim (raison sociale)',1],['siret','SIRET de l’agence',1,'siret'],['adresse','Adresse (n°, rue)',1],['cp','Code postal',1],['ville','Ville',1],['pays','Pays',1],['tel','Téléphone',0,'tel']],
  hab:[['atex','ATEX — préciser 0, 1 ou 2',0,'select',['','0','1','2']],['gies','GIES — préciser 1 ou 2',0,'select',['','1','2']],['m','M — préciser 0, 1 ou 2',0,'select',['','0','1','2']],
    ['b','B (ex. B1V, BR…)',0],['h','H (ex. H0V, H1…)',0],['e','E/ES',0],['ct','Chargé de travaux',0,'check'],['aucune','Aucune',0,'check'],['autres','Autres',0,'check']],
  docs:[['identite','Copie pièce d’identité en cours de validité',0,'check'],['habTitre','Copie titre d’habilitations H/B/M 0 (a minima)',0,'check'],['btp','Copie de la carte BTP',0,'check'],['autTravail','Autorisation de travail (hors EEE, Suisse, Andorre, Monaco, Saint-Marin)',0,'check'],
    ['a1','Formulaire A1 ou équivalent (employeur hors de France)',0,'check'],['designation','Lettre de désignation du représentant en France',0,'check'],['detachement','Convention de détachement',0,'check'],['amendes','Attestation sur l’honneur d’acquittement des amendes',0,'check'],
    ['apte','J’atteste que le salarié est médicalement apte à réaliser l’intervention',0,'check']],
  vehicle:[['immat','Immatriculation',1],['marque','Marque / modèle',1],['type','Type',1,'select',VTYPES],['assurance','N° de police d’assurance',1]],
  intervention:[['objet','Prestation',1],['commande','N° de commande',0],['du','Du',1,'date'],['au','Au',1,'date'],['horaires','Horaires',0],['site','Site',0],['lieu','Lieu / bâtiment',0],
    ['titulaire','Titulaire de la commande',1,'select',TIT,1],['caNom','Chargé d’affaires destinataire',1,'text',()=>(S.caBook||[]).map(c=>c.nom)],['caEmail','E-mail du chargé d’affaires',0,'email']],
  tit:[['raison','Société titulaire',1],['siret','SIRET',1,'siret'],['adresse','Adresse (n°, rue)',1],['cp','Code postal',1],['ville','Ville',1],['pays','Pays',0],['repNom','Représentant — nom',1],['repPrenom','Représentant — prénom',1],['repFonction','Représentant — fonction',0],['repTel','Représentant — téléphone',0,'tel']],
  ca:[['prenom','Prénom',1],['nom','Nom',1],['service','Service',1],['fonction','Fonction',1],['tel','Téléphone',0,'tel'],['email','E-mail',0,'email'],['site','Site / chantier',1]],
  garde:[['site','Site',1],['poste','Nom du poste de garde',0]],
  signer:[['nom','Nom du signataire',1],['prenom','Prénom du signataire',1],['fonction','Fonction',1],['date','Date',1,'date']]
};

/* ---------- ZIP (sans compression) ---------- */
const CRC_T=(()=>{ const t=new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c=c&1?0xEDB88320^(c>>>1):c>>>1; t[n]=c>>>0; } return t; })();
function crc32(u){ let c=0xFFFFFFFF; for(let i=0;i<u.length;i++) c=CRC_T[(c^u[i])&255]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }
function makeZip(entries){
  const enc=new TextEncoder(), parts=[], cd=[]; let off=0; const d=new Date();
  const t=(d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1), dd=((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate();
  for(const e of entries){ const nm=enc.encode(e.name), crc=crc32(e.data), sz=e.data.length;
    const L=new DataView(new ArrayBuffer(30)); [[0,0x04034b50,4],[4,20,2],[6,0x0800,2],[8,0,2],[10,t,2],[12,dd,2],[14,crc,4],[18,sz,4],[22,sz,4],[26,nm.length,2],[28,0,2]].forEach(([o,v,n])=>n===4?L.setUint32(o,v,true):L.setUint16(o,v,true));
    parts.push(L.buffer,nm,e.data);
    const C=new DataView(new ArrayBuffer(46)); [[0,0x02014b50,4],[4,20,2],[6,20,2],[8,0x0800,2],[10,0,2],[12,t,2],[14,dd,2],[16,crc,4],[20,sz,4],[24,sz,4],[28,nm.length,2],[30,0,2],[32,0,2],[34,0,2],[36,0,2],[38,0,4],[42,off,4]].forEach(([o,v,n])=>n===4?C.setUint32(o,v,true):C.setUint16(o,v,true));
    cd.push(C.buffer,nm); off+=30+nm.length+sz; }
  const cdSize=cd.reduce((a,b)=>a+b.byteLength,0), E=new DataView(new ArrayBuffer(22));
  E.setUint32(0,0x06054b50,true); E.setUint16(8,entries.length,true); E.setUint16(10,entries.length,true); E.setUint32(12,cdSize,true); E.setUint32(16,off,true);
  return new Blob([...parts,...cd,E.buffer],{type:'application/zip'});
}

async function importDossier(p, pdf){
  const ex=S.dossiers.find(d=>d.id===p.id), pid='d-'+p.id;
  if(pdf) await saveFile(pid,pdf,pdf.name);
  let oid=ex?ex.origId:null;
  if(p.original){ oid=pid+'-o'; await saveFile(oid,b64ToBlob(p.original.data,'application/pdf'),p.original.name); }
  const atts=[]; for(const [i,a] of (p.attachments||[]).entries()){ const aid=pid+'-a'+i; await saveFile(aid,b64ToBlob(a.data,a.type),a.name); atts.push({id:aid,key:a.key,name:a.name,type:a.type}); }
  if(ex && !atts.length) (ex.atts||[]).forEach(a=>atts.push(a));
  const rec={id:p.id, ref:p.ref, company:p.company, emp:p.emp, intervention:p.intervention, mode:p.mode, vehicle:p.vehicle, signature:p.signature, empSig:p.empSig||null, atts,
    pdfId:pdf?pid:(ex?ex.pdfId:null), origId:oid, receivedAt:nowISO(),
    validation: ex && ex.status!=='refuse' ? ex.validation||null : null, validPdfId: ex && ex.status!=='refuse' ? ex.validPdfId||null : null,
    status: ex && ex.status!=='refuse' ? ex.status : 'recu', motif: ex && ex.status!=='refuse' ? ex.motif : '',
    history: ex ? [...ex.history,{t:now(),what:'Nouvel envoi reçu, dossier mis à jour'}] : [{t:now(),what:'Dossier reçu de '+p.company.raison}]};
  if(ex) Object.assign(ex,rec); else S.dossiers.push(rec);
}
function upsertEntry(e){ const i=S.gate.findIndex(x=>x.id===e.id); e.receivedAt=nowISO(); if(i>=0) S.gate[i]=Object.assign(S.gate[i],e); else S.gate.push(e); }
async function importFiles(files, role){
  role=role||S.role; let ok=0, skip=0, note='';
  for(const f of files){
    let data=null; const isPdf=/pdf/i.test(f.type)||/\.pdf$/i.test(f.name);
    try{ data = isPdf ? await extractData(f) : JSON.parse(await f.text()); }catch(e){ data=null; }
    if(!data||!data.type){ skip++; continue; }
    if(data.type==='acces-site/backup'){ note=' · sauvegarde : utilisez Réglages › Restaurer'; skip++; continue; }
    if(role==='ca' && data.type==='acces-site/dossier'){ await importDossier(data, isPdf?f:null); ok++; }
    else if(role==='garde' && data.type==='acces-site/liste'){ (data.entries||[]).forEach(upsertEntry); ok+=(data.entries||[]).length; }
    else if(role==='garde' && data.type==='acces-site/dossier'){ upsertEntry(entryFrom(data)); ok++; }
    else skip++;
  }
  await persist(); return {ok,skip,note};
}
async function purge(){
  const days=+S.settings.retention; if(!days) return 0;
  const lim=addDays(-days); let n=0;
  for(const r of S.requests.filter(r=>r.intervention.au<lim)){ await delFile(r.pdfId); await delFile(r.origId); n++; }
  for(const d of S.dossiers.filter(d=>d.intervention.au<lim)){ await delFile(d.pdfId); await delFile(d.origId); await delFile(d.validPdfId); for(const a of d.atts||[]) await delFile(a.id); n++; }
  S.requests=S.requests.filter(r=>r.intervention.au>=lim); S.dossiers=S.dossiers.filter(d=>d.intervention.au>=lim);
  const g=S.gate.length; S.gate=S.gate.filter(e=>e.au>=lim); n+=g-S.gate.length;
  S.log=S.log.filter(p=>p.date>=lim);
  if(n) await persist(); return n;
}

function compressImg(file){ return new Promise(res=>{ const u=URL.createObjectURL(file), im=new Image();
  im.onload=()=>{ const k=Math.min(1,1600/Math.max(im.width,im.height)), c=document.createElement('canvas'); c.width=Math.round(im.width*k); c.height=Math.round(im.height*k);
    const x=c.getContext('2d'); x.fillStyle='#fff'; x.fillRect(0,0,c.width,c.height); x.drawImage(im,0,0,c.width,c.height); URL.revokeObjectURL(u);
    c.toBlob(b=>res(new File([b],file.name.replace(/\.[^.]+$/,'')+'.jpg',{type:'image/jpeg'})),'image/jpeg',0.8); };
  im.onerror=()=>{ URL.revokeObjectURL(u); res(null); }; im.src=u; }); }

  const L=[...S.employees].sort((a,b)=>a.nom.localeCompare(b.nom,'fr'));
  return `${installHint()}<h2>Salariés</h2><p class="sub">Une fiche par salarié, réutilisée pour toutes les demandes.</p>
  <button class="btn" data-act="emp-new">＋ Ajouter un salarié</button><div style="height:14px"></div>
  ${L.map(e=>card({act:'emp-edit',id:e.id,av:ini(e.prenom,e.nom),t:`${h(e.prenom)} ${h(e.nom)}`,m:h(e.fonction),pills:e.veh&&e.veh.immat?`<span class="plate">${h(e.veh.immat)}</span>`:''})).join('')||empty('Aucun salarié pour l’instant')}`;
}
const reqCard = r => card({act:'open-req',id:r.id,av:ini(r.emp.prenom,r.emp.nom),t:`${h(r.emp.prenom)} ${h(r.emp.nom)}`,m:`${h(r.intervention.site)} · ${fmtD(r.intervention.du)} → ${fmtD(r.intervention.au)}`,
  pills:pill(RS,r.status)+`<span class="pill">${modeL(r.mode)}</span>`+(r.vehicle?`<span class="plate">${h(r.vehicle.immat)}</span>`:'')});
function vDemandes(){
  const by=s=>S.requests.filter(r=>r.status===s).sort((a,b)=>a.intervention.du.localeCompare(b.intervention.du));
  const A=by('a_signer'), B=by('signee'), C=by('envoyee').reverse();
  return `<h2>Demandes d’accès</h2><button class="btn" data-act="wiz-new">＋ Nouvelle demande</button>
  <h3 class="sec">À signer (${A.length})</h3>${A.length>1?`<button class="btn sec2" data-act="sign-all" style="margin:0 0 10px">✍️ Faire signer les ${A.length} demandes en une fois</button>`:''}${A.map(reqCard).join('')||empty('Rien à signer')}
  <h3 class="sec">Signées — à envoyer (${B.length})</h3>${B.length>1?`<button class="btn sec2" data-act="send-all" style="margin:0 0 10px">📤 Envoyer les ${B.length} au chargé d’affaires</button>`:''}${B.map(reqCard).join('')||empty('—')}
  <h3 class="sec">Envoyées (${C.length})</h3>${C.map(reqCard).join('')||empty('—')}`;
}
function vWizard(){
  const W=ui.wiz, steps=['Salariés','Prestation','Mode d’accès','Récapitulatif'], s=W.step, ids=Object.keys(W.sel);
  let x=`<div class="steps">${steps.map((_,j)=>`<i class="${j<=s?'on':''}"></i>`).join('')}</div><h2>${steps[s]}</h2>`;
  if(s===0){
    const L=[...S.employees].sort((a,b)=>a.nom.localeCompare(b.nom,'fr'));
    x+=`<p class="sub">Sélectionnez un ou plusieurs salariés : une demande sera créée pour chacun.</p>`
      + L.map(e=>card({act:'wsel',id:e.id,sel:!!W.sel[e.id],t:`${h(e.prenom)} ${h(e.nom)}`,m:h(e.fonction),right:' '})).join('')
      + `<button class="link" data-act="emp-new">＋ Créer une fiche salarié</button>`;
  }
  if(s===1) x+=`<p class="sub">Commun à tous les salariés sélectionnés. Reprend le cadre « Renseignements sur la prestation » de la FIDAA.</p><div class="panel">${FD.intervention.map(d=>field(d,'inter')).join('')}</div>`
    + (W.inter.titulaire===TIT[1] ? `<div class="panel"><h3>Société titulaire de la commande</h3>${FD.tit.map(d=>field(d,'inter.tit')).join('')}</div>` : '');
  if(s===2){
    x+=`<div class="hint info">ℹ️ Piéton : FIDAA seule. Piéton + véhicule : FIDAA + autorisation d’accès véhicule.</div>`;
    ids.forEach(id=>{ const e=S.employees.find(z=>z.id===id), c=W.sel[id];
      x+=`<div class="panel"><b>${h(e.prenom)} ${h(e.nom)}</b><div class="seg"><button class="${c.mode==='pieton'?'on':''}" data-act="wmode" data-id="${id}" data-m="pieton">🚶 Piéton</button><button class="${c.mode==='vehicule'?'on':''}" data-act="wmode" data-id="${id}" data-m="vehicule">🚶🚐 Piéton + véhicule</button></div>
        ${c.mode==='vehicule'?FD.vehicleReq.map(d=>field(d,'sel.'+id+'.veh')).join(''):''}</div>`; });
  }
  if(s===3){
    const I=W.inter, nv=ids.filter(i=>W.sel[i].mode==='vehicule').length;
    x+=`<div class="panel"><h3>Prestation</h3>${kvs([['Prestation',h(I.objet)],['N° de commande',h(I.commande)],['Période',`${fmtD(I.du)} → ${fmtD(I.au)}`],['Titulaire',h(I.titulaire===TIT[1]?(I.tit||{}).raison:S.company.raison)],['Site',h(I.site)]])}</div>
      <div class="panel"><h3>${ids.length} demande${ids.length>1?'s':''} · ${ids.length+nv} document${ids.length+nv>1?'s':''}</h3><ul class="docs">${ids.map(id=>{ const e=S.employees.find(z=>z.id===id), c=W.sel[id];
        return `<li class="ok">${h(e.prenom)} ${h(e.nom)} — ${c.mode==='vehicule'?'FIDAA + accès véhicule ('+h(c.veh.immat)+')':'FIDAA'}</li>`; }).join('')}</ul></div>`;
  }
  x+=`<div class="row2">${s>0?`<button class="btn ghost" data-act="wiz-prev">Retour</button>`:''}${s<3?`<button class="btn" data-act="wiz-next">Continuer</button>`:`<button class="btn" data-act="wiz-create">Créer ${ids.length>1?'les demandes':'la demande'}</button>`}</div>`;
  return x;
}
function vReq(v){
  const r=S.requests.find(z=>z.id===v.id); if(!r) return empty('Demande introuvable');
  const I=r.intervention; let a='';
  if(r.status==='a_signer') a=`<div class="hint">✍️ À faire signer par le dirigeant ou un responsable de la société.</div>
    <button class="btn ghost" data-act="emp-sign">${r.empSig?'✅ Visa du salarié signé — refaire':'✍️ Faire signer le salarié (visa intervenant, facultatif)'}</button>
    <button class="btn" data-act="sign-one">Signer dans l’app (employeur)</button>
    <button class="btn sec2" data-act="req-export">📄 Exporter le PDF à imprimer et signer</button>
    <label class="btn ghost filebtn">📎 Importer le PDF signé (scan)<input type="file" id="signedIn" accept="application/pdf,.pdf"></label>`;
  if(r.status==='signee') a=`<div class="hint ok">✅ Signée par ${h(r.signature.nom)} le ${fmtD(r.signature.date)}${r.signature.method==='pdf'?' (original scanné)':''}.</div>
    <button class="btn" data-act="req-send">📤 Envoyer au chargé d’affaires</button><button class="btn sec2" data-act="req-view">Voir le PDF</button>`;
  if(r.status==='envoyee') a=`<div class="hint ok">📤 Envoyée le ${fmtD(r.sentAt)}.</div><button class="btn sec2" data-act="req-view">Voir le PDF</button><button class="btn ghost" data-act="req-send">Renvoyer</button>`;
  return `<div class="hero"><div class="av lg">${ini(r.emp.prenom,r.emp.nom)}</div><div><div class="t">${h(r.emp.prenom)} ${h(r.emp.nom)}</div><div class="m">${h(r.emp.fonction)} · Réf. ${h(r.ref)}</div><div class="pills">${pill(RS,r.status)}<span class="pill">${modeL(r.mode)}</span></div></div></div>
  ${plateP(r.vehicle)}${a}
  <div class="panel" style="margin-top:12px"><h3>Documents</h3><ul class="docs"><li class="${r.signature?'ok':'wait'}">FIDAA</li>${r.mode==='vehicule'?`<li class="${r.signature?'ok':'wait'}">Autorisation d’accès véhicule</li>`:'<li class="na">Accès véhicule — non requis (piéton)</li>'}${r.origId?'<li class="ok">Original signé (scan) joint</li>':''}</ul></div>
  <div class="panel"><h3>Prestation</h3>${kvs([['Prestation',h(I.objet)],['N° de commande',h(I.commande)],['Période',`${fmtD(I.du)} → ${fmtD(I.au)}`],['Horaires',h(I.horaires)],['Site',h([I.site,I.lieu].filter(Boolean).join(' — '))],['Chargé d’affaires',h(I.caNom)]])}</div>
  <button class="btn ghost danger" data-act="req-del">Supprimer la demande</button>`;
}

  <button class="btn" data-act="sign-do">Signer ${L.length>1?'les '+L.length+' documents':'le document'}</button>`;

function vEntSettings(){
  const c=S.company||{};

/* ----- Chargé d’affaires ----- */
const dCard = d => card({act:'open-dossier',id:d.id,av:ini(d.emp.prenom,d.emp.nom),t:`${h(d.emp.prenom)} ${h(d.emp.nom)}`,m:`${h(d.company.raison)} · ${fmtD(d.intervention.du)} → ${fmtD(d.intervention.au)}`,
  pills:pill(DS,d.status)+`<span class="pill">${modeL(d.mode)}</span>`+(d.vehicle?`<span class="plate">${h(d.vehicle.immat)}</span>`:'')+(d.signature?'':'<span class="pill red">Non signé</span>')});
function vPlanning(){
  const days=[...Array(21)].map((_,i)=>addDays(i-2)); if(!days.includes(ui.day)) ui.day=todayISO();
  const L=forDay(ui.day).sort((a,b)=>a.emp.nom.localeCompare(b.emp.nom,'fr')), R=L.filter(d=>d.status==='recu'), V=L.filter(d=>d.status!=='recu');
  const strip=days.map(d=>`<button class="day ${d===ui.day?'on':''}" data-act="day" data-id="${d}"><small>${d===todayISO()?'auj.':new Date(d+'T12:00').toLocaleDateString('fr-FR',{weekday:'short'}).replace('.','')}</small><b>${+d.slice(8)}</b><i class="${forDay(d).length?'':'z'}"></i></button>`).join('');
  return `${importBtn('Importer un dossier reçu')}<div class="datestrip" id="strip">${strip}</div>
  <h2 style="text-transform:capitalize;margin-bottom:4px">${longDate(ui.day)}</h2><p class="sub" style="margin:0 0 4px">${L.length} personne${L.length>1?'s':''} attendue${L.length>1?'s':''}</p>
  <h3 class="sec">À valider (${R.length})</h3>${R.map(dCard).join('')||empty('Rien à valider')}
  <h3 class="sec">Validés (${V.length})</h3>${V.map(dCard).join('')||empty('—')}
  ${V.length?`<button class="btn" data-act="send-day">🚧 Envoyer la liste du jour au poste de garde (${V.length})</button>`:''}`;
}
function dossierResults(){
  const q=ui.q.trim().toLowerCase();
  if(q){ const L=S.dossiers.filter(d=>[d.emp.nom,d.emp.prenom,d.company.raison,d.vehicle&&d.vehicle.immat,d.ref].join(' ').toLowerCase().includes(q)).sort((a,b)=>b.intervention.du.localeCompare(a.intervention.du));
    return `<h3 class="sec">Résultats (${L.length})</h3>${L.map(dCard).join('')||empty('Aucun dossier trouvé')}`; }
  const cos=[...new Set(S.dossiers.map(d=>d.company.raison))].sort((a,b)=>a.localeCompare(b,'fr'));
  return `<h3 class="sec">Sociétés (${cos.length})</h3>`+(cos.map(c=>{ const L=S.dossiers.filter(d=>d.company.raison===c), p=L.filter(d=>d.status==='recu').length;
    return card({act:'open-company',id:c,av:'📁',t:h(c),m:`${L.length} dossier${L.length>1?'s':''}${p?` · <b style="color:var(--warn)">${p} à valider</b>`:''}`}); }).join('')||empty('Aucun dossier. Importez les fichiers reçus des entreprises.'));
}
function vDossiers(){
  return `<h2>Dossiers</h2><p class="sub">Classés automatiquement par société, puis par date d’autorisation.</p>
  <input id="q" class="search" type="search" placeholder="Nom, société, immatriculation, réf…" value="${h(ui.q)}" autocomplete="off"><div id="results">${dossierResults()}</div>
  ${S.dossiers.length?`<button class="btn ghost" data-act="zip">🗜️ Exporter tous les dossiers (ZIP)</button>`:''}`;
}
function vCompany(v){
  const L=S.dossiers.filter(d=>d.company.raison===v.id).sort((a,b)=>a.intervention.du.localeCompare(b.intervention.du)); let x=`<h2>${h(v.id)}</h2><p class="sub">${L.length} dossier${L.length>1?'s':''}, du plus ancien au plus récent</p>`, last='';
  L.forEach(d=>{ const m=new Date(d.intervention.du+'T12:00').toLocaleDateString('fr-FR',{month:'long',year:'numeric'}); if(m!==last){ x+=`<h3 class="sec">${m}</h3>`; last=m; } x+=dCard(d); });
  return x;
}
function vDossier(v){
  const d=S.dossiers.find(z=>z.id===v.id); if(!d) return empty('Dossier introuvable');
  const I=d.intervention, c=d.company; let a='';
  if(d.status==='recu') a=`<div class="row2"><button class="btn bad" data-act="ca-refuse">Refuser</button><button class="btn ok" data-act="ca-validate">Valider</button></div>`;
  const vdoc = d.validation ? `<li class="ok">FIDAA validée par ${h(d.validation.prenom)} ${h(d.validation.nom)} le ${fmtD(d.validation.date)}${d.validation.h24?' · profil 24h/24':''}</li>` : '';
  if(d.status==='valide') a=`<button class="btn" data-act="send-one" style="margin-bottom:12px">🚧 Envoyer au poste de garde</button>`;
  if(d.status==='transmis') a=`<div class="hint ok">🚧 Transmis au poste de garde${d.transmittedAt?' le '+fmtD(d.transmittedAt):''}.</div>`;
  if(d.status==='refuse') a=`<div class="hint bad">⛔ Refusé : ${h(d.motif)}</div>`;
  const mail=c.email?`mailto:${encodeURIComponent(c.email)}?subject=${encodeURIComponent('Demande d’accès '+d.ref+' — '+d.emp.prenom+' '+d.emp.nom)}&body=${encodeURIComponent(`Bonjour,\n\nVotre demande d’accès ${d.ref} pour ${d.emp.prenom} ${d.emp.nom} (${fmtD(I.du)} → ${fmtD(I.au)}) est : ${DS[d.status].l.toLowerCase()}${d.status==='refuse'?' — motif : '+d.motif:''}.\n\nCordialement,\n${caName()}`)}`:'';
  return `<div class="hero"><div class="av lg">${ini(d.emp.prenom,d.emp.nom)}</div><div><div class="t">${h(d.emp.prenom)} ${h(d.emp.nom)}</div><div class="m">${h(d.emp.fonction)} · ${h(c.raison)}</div><div class="pills">${pill(DS,d.status)}<span class="pill">${modeL(d.mode)}</span></div></div></div>
  ${d.signature?'':'<div class="hint bad">⚠️ Document non signé par l’employeur.</div>'}${plateP(d.vehicle)}${a}
  <div class="panel"><h3>Documents</h3><ul class="docs"><li class="${d.signature?'ok':'wait'}">FIDAA${d.signature?` — signée par ${h(d.signature.nom)} le ${fmtD(d.signature.date)}`:''}</li>${d.mode==='vehicule'?'<li class="ok">Autorisation d’accès véhicule</li>':'<li class="na">Accès véhicule — non requis (piéton)</li>'}${d.origId?'<li class="ok">Original signé (scan)</li>':''}${vdoc}</ul>
  ${d.validation?'<button class="btn" data-act="d-valid">📄 FIDAA validée (voir / partager)</button>':''}${(d.atts||[]).length?`<h3 style="margin-top:14px">Pièces jointes (${d.atts.length})</h3>${d.atts.map(a=>`<button class="btn ghost" data-act="d-att" data-id="${h(a.id)}">📎 ${h(DOCL[a.key]||a.key)} — ${h(a.name)}</button>`).join('')}`:''}<button class="btn sec2" data-act="d-pdf">Voir la FIDAA reçue</button>${d.origId?'<button class="btn ghost" data-act="d-orig">Voir l’original signé</button>':''}</div>
  <div class="panel"><h3>Prestation</h3>${kvs([['Prestation',h(I.objet)],['N° de commande',h(I.commande)],['Période',`${fmtD(I.du)} → ${fmtD(I.au)}`],['Horaires',h(I.horaires)],['Site',h([I.site,I.lieu].filter(Boolean).join(' — '))]])}</div>
  <div class="panel"><h3>Entreprise</h3>${kvs([['Raison sociale',h(c.raison)],['SIRET',h(c.siret)+(siretOk(c.siret)?'':' ⚠️')],['Adresse',`${h(c.adresse)}, ${h(c.cp)} ${h(c.ville)}`],['Contact',[h(c.tel),h(c.email)].filter(Boolean).join('<br>')]])}
  ${mail?`<a class="btn ghost" href="${mail}">✉️ Informer l’entreprise par e-mail</a>`:''}</div>
  <div class="panel"><h3>Historique</h3><div class="tl">${d.history.map(x=>`<div><b>${h(x.t)}</b> · ${h(x.what)}</div>`).join('')}</div></div>
  <button class="btn ghost danger" data-act="d-del">Supprimer le dossier</button>`;
}

const validName = d => `FIDAA-VALIDEE_${d.ref}_${safe(d.emp.nom)}_${safe(d.emp.prenom)}.pdf`;
async function makeValidPdf(d){
  const blob=await makeRequestPdf(d, pkgData(d));
  await saveFile('v-'+d.id, fileOf(blob,validName(d)), validName(d)); d.validPdfId='v-'+d.id;
}

/* ----- Poste de garde ----- */
const eCard = e => { const p=todayPass(e.id);
  return card({act:'open-entry',id:e.id,av:ini(e.prenom,e.nom),avc:p?(p.decision==='ok'?'g':'r'):'',t:`${h(e.prenom)} ${h(e.nom)}`,m:`${h(e.societe)} · ${fmtD(e.du)} → ${fmtD(e.au)}${e.caNom?' · '+h(e.caNom):''}`,
    pills:(p?(p.decision==='ok'?`<span class="pill green">Entré à ${h(p.time)}</span>`:`<span class="pill red">Refusé à ${h(p.time)}</span>`):'')+`<span class="pill">${modeL(e.mode)}</span>`+(e.immat?`<span class="plate">${h(e.immat)}</span>`:'')}); };
function todayResults(){
  const q=ui.q.trim().toLowerCase(); let L=S.gate.filter(inRange).sort((a,b)=>a.nom.localeCompare(b.nom,'fr'));
  if(q) L=L.filter(e=>[e.nom,e.prenom,e.societe,e.immat].join(' ').toLowerCase().includes(q));
  const P=L.filter(e=>!todayPass(e.id)), D=L.filter(e=>todayPass(e.id));
  return `<h3 class="sec">À contrôler (${P.length})</h3>${P.map(eCard).join('')||empty('Personne en attente')}<h3 class="sec">Contrôlés aujourd’hui (${D.length})</h3>${D.map(eCard).join('')||empty('—')}`;
}
function vToday(){
  return `${importBtn('Importer la liste du jour')}<h2 style="text-transform:capitalize;margin-top:16px">${longDate(todayISO())}</h2>
  <input id="q" class="search" type="search" placeholder="Nom, société ou immatriculation…" value="${h(ui.q)}" autocomplete="off"><div id="results">${todayResults()}</div>`;
}
function vEntry(v){
  const e=S.gate.find(z=>z.id===v.id); if(!e) return empty('Introuvable');
  const p=todayPass(e.id), hist=S.log.filter(x=>x.entryId===e.id).sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));
  let a = p ? `<div class="hint ${p.decision==='ok'?'ok':'bad'}">${p.decision==='ok'?'✅ Entrée autorisée aujourd’hui à '+h(p.time):'⛔ Entrée refusée aujourd’hui à '+h(p.time)+' — '+h(p.motif)}</div>`

/* ---------- Signature tactile ---------- */
function initSig(){
  const c=$('#sig'); if(!c) return;
  const r=c.getBoundingClientRect(), dpr=Math.min(window.devicePixelRatio||1,2);
  c.width=r.width*dpr; c.height=r.height*dpr;
  const x=c.getContext('2d'); x.scale(dpr,dpr); x.lineWidth=2.4; x.lineCap='round'; x.lineJoin='round'; x.strokeStyle='#0b1f33';
  if(ui.sigImg){ const im=new Image(); im.onload=()=>x.drawImage(im,0,0,r.width,r.height); im.src=ui.sigImg; }
  let on=false; const pt=e=>{ const b=c.getBoundingClientRect(); return [e.clientX-b.left,e.clientY-b.top]; };
  c.onpointerdown=e=>{ on=true; try{ c.setPointerCapture(e.pointerId); }catch(_){} x.beginPath(); x.moveTo(...pt(e)); };
  c.onpointermove=e=>{ if(!on) return; x.lineTo(...pt(e)); x.stroke(); };
  c.onpointerup=c.onpointercancel=()=>{ if(!on) return; on=false; ui.sigImg=c.toDataURL('image/png'); };
}

      await persist(); toast('Enregistré'); return render();
    }
    case 'switch-role': ui.prevRole=S.role; S.role=null; await persist(); resetNav(); render(); return toast('Vos informations sont conservées pour chaque profil');
    /* salariés */
    case 'emp-new': ui.form={pays:'France',nationalite:'Française',veh:{type:VTYPES[0]},agence:{pays:'France'},hab:{},docs:{}}; return go({type:'form',kind:'employee'});

      await makeValidPdf(D); D.status='valide'; D.history.push({t:now(),what:'Dossier validé'+(h24?' (profil 24h/24)':'')}); await persist(); render(); return toast('FIDAA validée');
    }
    case 'd-valid': { let f=D.validPdfId?await getFile(D.validPdfId):null; if(!f){ await makeValidPdf(D); await persist(); f=await getFile(D.validPdfId); } return openPdf(f,f.name); }
    case 'ca-sig': ui.sigImg=(S.ca&&S.ca.sig)||null; return go({type:'casig'});
    case 'ca-sig-save': if(!ui.sigImg) return toast('Signez dans le cadre'); S.ca.sig=ui.sigImg; ui.sigImg=null; await persist(); back(); return toast('Signature enregistrée');
    case 'ca-sig-del': S.ca.sig=null; ui.sigImg=null; await persist(); back(); return toast('Signature supprimée');
    case 'ca-refuse': return askReason('Refuser le dossier',async r=>{ D.status='refuse'; D.motif=r; D.history.push({t:now(),what:'Refusé : '+r}); await persist(); render(); toast('Dossier refusé'); });
    case 'd-pdf': { const f=D.pdfId?await getFile(D.pdfId):null; const blob=f||await makeRequestPdf(D); return openPdf(blob,f?f.name:`${D.ref}_${safe(D.emp.nom)}.pdf`); }
    case 'd-att': { const f=await getFile(id); return f?openPdf(f,f.name):toast('Fichier introuvable'); }
    case 'd-orig': { const f=await getFile(D.origId); return f?openPdf(f,f.name):toast('Original introuvable'); }
    case 'd-del': return askConfirm('Supprimer le dossier ?','Il sera effacé de ce téléphone.','Supprimer',async()=>{ await delFile(D.pdfId); await delFile(D.origId); await delFile(D.validPdfId); for(const a of D.atts||[]) await delFile(a.id); S.dossiers=S.dossiers.filter(z=>z.id!==D.id); await persist(); back(); });
    case 'send-day': { const L=forDay(ui.day).filter(d=>d.status!=='recu'); return sendToGate(L,`Liste d’accès du ${fmtD(ui.day)}`,`Liste-acces_${ui.day}.pdf`,`${longDate(ui.day)} — ${S.ca?S.ca.site:''}`); }
    case 'send-one': return sendToGate([D],'Autorisation d’accès',`Acces_${D.ref}_${safe(D.emp.nom)}.pdf`,`${D.emp.prenom} ${D.emp.nom} — ${D.company.raison}`);
    case 'zip': return exportZip();
    /* poste de garde */
    case 'open-entry': return go({type:'entry',id});
    case 'g-grant': S.log.push({id:uid(),entryId:E.id,date:todayISO(),time:hm(),decision:'ok',motif:'',nom:E.nom,prenom:E.prenom,societe:E.societe,immat:E.immat,poste:S.garde&&S.garde.poste||''}); await persist(); render(); return toast('Entrée enregistrée');
    case 'g-refuse': return askReason('Refuser l’entrée',async r=>{ S.log.push({id:uid(),entryId:E.id,date:todayISO(),time:hm(),decision:'ko',motif:r,nom:E.nom,prenom:E.prenom,societe:E.societe,immat:E.immat,poste:S.garde&&S.garde.poste||''}); await persist(); render(); toast('Refus enregistré'); });
    case 'csv-log': { const rows=[['Date','Heure','Poste','Nom','Prénom','Société','Immatriculation','Décision','Motif']].concat([...S.log].sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).map(p=>[fmtD(p.date),p.time,p.poste||'',p.nom,p.prenom,p.societe,p.immat,p.decision==='ok'?'Autorisé':'Refusé',p.motif]));
      return openShare({title:'Registre des passages',files:[fileOf(new Blob([csv(rows)],{type:'text/csv'}),`Registre_${todayISO()}.csv`,'text/csv')]}); }
    /* sécurité & données */
    case 'pin-set': return modal(`<div class="box"><div class="scroll"><h2>Code de verrouillage</h2><p class="sub">4 à 8 chiffres, demandé à l’ouverture de l’app.</p>
      <label class="fld"><span>Nouveau code</span><input id="pin1" type="password" inputmode="numeric" maxlength="8"></label><label class="fld"><span>Confirmer</span><input id="pin2" type="password" inputmode="numeric" maxlength="8"></label>
      <div class="row2"><button class="btn ghost" data-act="close">Annuler</button><button class="btn" data-act="pin-save">Enregistrer</button></div></div></div>`);
    case 'pin-save': { const p1=$('#pin1').value, p2=$('#pin2').value; if(!/^\d{4,8}$/.test(p1)) return toast('4 à 8 chiffres'); if(p1!==p2) return toast('Les codes ne correspondent pas');
      S.settings.pinHash=await hash(p1); await persist(); closeModal(); render(); return toast('Code enregistré'); }
    case 'pin-del': S.settings.pinHash=null; await persist(); render(); return toast('Code supprimé');
    case 'unlock': { const p=$('#pinIn').value; if(await hash(p)===S.settings.pinHash){ ui.locked=false; render(); } else { toast('Code incorrect'); $('#pinIn').value=''; } return; }
    case 'backup': return exportBackup();
    case 'wipe': return askConfirm('Effacer toutes les données ?','Tous les profils, salariés, demandes, dossiers et le registre seront supprimés de ce téléphone. Pensez à exporter une sauvegarde avant.','Tout effacer',async()=>{ await Store.clear(); S=defaultS(); ui.locked=false; resetNav(); render(); toast('Données effacées'); });
  }
}
async function prepareSend(list){
  if(!list.length) return;
  const files=[]; for(const r of list){ const f=await getFile(r.pdfId); if(f) files.push(fileOf(f,pdfName(r))); const o=r.origId?await getFile(r.origId):null; if(o) files.push(fileOf(o,'ORIGINAL-SIGNE_'+pdfName(r))); }
  openShare({title:list.length>1?`${list.length} demandes d’accès`:'Demande d’accès',files,simRole:'ca',
    onDone:async()=>{ list.forEach(r=>{ r.status='envoyee'; r.sentAt=nowISO(); }); await persist(); render(); }});
}
async function sendToGate(list,title,fname,sub){
  if(!list.length) return toast('Aucun dossier validé');
  const data={type:'acces-site/liste',v:1,site:S.ca?S.ca.site:'',from:caName(),sentAt:nowISO(),entries:list.map(entryFrom)};
  const blob=await makeListPdf(title,sub,data.entries,data);
  openShare({title:'Envoyer au poste de garde',files:[fileOf(blob,fname)],simRole:'garde',
    onDone:async()=>{ list.forEach(d=>{ if(d.status==='valide'){ d.status='transmis'; d.transmittedAt=nowISO(); } d.history.push({t:now(),what:'Transmis au poste de garde'}); }); await persist(); render(); }});
}
async function exportZip(){
  toast('Préparation du ZIP…');
  const L=[...S.dossiers].sort((a,b)=>a.intervention.du.localeCompare(b.intervention.du)), entries=[], root='Dossiers_Acces_Site/';
  for(const d of L){ const f=(d.validPdfId?await getFile(d.validPdfId):null)||(d.pdfId?await getFile(d.pdfId):null), blob=f||await makeRequestPdf(d), base=`${root}${safe(d.company.raison)}/${d.intervention.du}_${safe(d.emp.nom)}_${safe(d.emp.prenom)}_${safe(d.ref)}`;
    entries.push({name:base+'.pdf',data:new Uint8Array(await blob.arrayBuffer())});
    if(d.origId){ const o=await getFile(d.origId); if(o) entries.push({name:base+'_original-signe.pdf',data:new Uint8Array(await o.arrayBuffer())}); }
    for(const a of d.atts||[]){ const o=await getFile(a.id); if(o) entries.push({name:base+'_PJ_'+safe(a.name),data:new Uint8Array(await o.arrayBuffer())}); } }
  const rows=[['Début','Fin','Société','Nom','Prénom','Accès','Immatriculation','Statut','Réf.']].concat(L.map(d=>[fmtD(d.intervention.du),fmtD(d.intervention.au),d.company.raison,d.emp.nom,d.emp.prenom,d.mode==='vehicule'?'Piéton + véhicule':'Piéton',d.vehicle?d.vehicle.immat:'',DS[d.status].l,d.ref]));
  entries.push({name:root+'Planning.csv',data:new TextEncoder().encode(csv(rows))});
  openShare({title:'Export des dossiers',files:[fileOf(makeZip(entries),`Dossiers_Acces_Site_${todayISO()}.zip`,'application/zip')]});
}
async function exportBackup(){
  const ids=[]; S.requests.forEach(r=>ids.push(r.pdfId,r.origId)); S.dossiers.forEach(d=>{ ids.push(d.pdfId,d.origId,d.validPdfId); (d.atts||[]).forEach(a=>ids.push(a.id)); }); S.employees.forEach(e=>(e.atts||[]).forEach(a=>ids.push(a.id)));
  const files={}; for(const id of ids.filter(Boolean)){ const r=await Store.get('files',id); if(r) files[id]={type:r.type,name:r.name,data:btoa(u8ToBin(new Uint8Array(r.buf)))}; }
  const data={type:'acces-site/backup',v:1,date:nowISO(),S:Object.assign(clone(S),{settings:Object.assign({},S.settings,{pinHash:null})}),files};
  openShare({title:'Sauvegarde',files:[fileOf(new Blob([JSON.stringify(data)],{type:'application/json'}),`AccesSite_sauvegarde_${todayISO()}.json`,'application/json')]});
}
async function restoreBackup(file){
  let data; try{ data=JSON.parse(await file.text()); }catch(e){ return toast('Fichier illisible'); }
  if(!data||data.type!=='acces-site/backup') return toast('Ce n’est pas une sauvegarde Accès Site');
  askConfirm('Restaurer la sauvegarde ?',`Sauvegarde du ${fmtD(data.date)}. Les données actuelles de ce téléphone seront remplacées.`,'Restaurer',async()=>{
    await Store.clear(); for(const [id,f] of Object.entries(data.files||{})) await saveFile(id,b64ToBlob(f.data,f.type),f.name);
    S=Object.assign(defaultS(),data.S); await persist(); resetNav(); render(); toast('Sauvegarde restaurée'); });
}

/* ---------- Événements ---------- */
document.addEventListener('click',e=>{
  if(e.target.id==='modal') return closeModal();
  const el=e.target.closest('[data-act]'); if(!el) return;
  Promise.resolve(act(el.dataset.act,el,e)).catch(err=>{ console.error(err); toast('Erreur : '+err.message); });
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.f && ui.form && t.type!=='checkbox'){ setPath(ui.form,t.dataset.f,t.value); const f=t.closest('.fld'); f&&f.classList.remove('err'); }
  if(t.id==='q'){ ui.q=t.value; const r=$('#results'); if(r) r.innerHTML=RESULTS[S.role](); }
});
document.addEventListener('change',async e=>{
  const t=e.target;
  try{
    if(t.dataset.f && ui.form && t.type==='checkbox') setPath(ui.form,t.dataset.f,t.checked);
    if(t.dataset.rr){ const y=window.scrollY; render(); window.scrollTo(0,y); }
    if(t.id==='f_inter_caNom' && ui.form && ui.form.inter){ const c=(S.caBook||[]).find(x=>x.nom===t.value); const em=$('#f_inter_caEmail'); if(c && c.email && em && !em.value){ em.value=c.email; ui.form.inter.caEmail=c.email; } }
    if(t.id==='retSel'){ S.settings.retention=+t.value; await persist(); const n=await purge(); toast(n?`${n} élément(s) ancien(s) effacé(s)`:'Réglage enregistré'); render(); }
    if(t.id==='importIn' && t.files.length){ const r=await importFiles([...t.files]); render(); toast(r.ok?`${r.ok} élément${r.ok>1?'s':''} importé${r.ok>1?'s':''}${r.skip?` · ${r.skip} fichier(s) ignoré(s)`:''}${r.note}`:`Aucun dossier Accès Site trouvé dans ce fichier${r.note}`); }
    if(t.dataset.att && t.files[0] && ui.form){
      let f=t.files[0]; const isImg=/^image\//.test(f.type);
      if(!isImg && !/pdf/i.test(f.type) && !/\.pdf$/i.test(f.name)) return toast('Photo ou PDF uniquement');
      if(isImg){ const c=await compressImg(f); if(!c) return toast('Image illisible'); f=c; }
      if(f.size>8e6) return toast('Fichier trop lourd (8 Mo max)');
      const a={id:'att-'+uid(),key:t.dataset.att,name:f.name,type:f.type||'application/pdf',size:f.size}; await saveFile(a.id,f,f.name);
      ui.form.atts=(ui.form.atts||[]).concat(a); setPath(ui.form,'docs.'+a.key,true); const y=window.scrollY; render(); window.scrollTo(0,y); return toast('Fichier joint');
    }
    if(t.id==='restoreIn' && t.files[0]){ await restoreBackup(t.files[0]); t.value=''; }
    if(t.id==='signedIn' && t.files[0]){
      const f=t.files[0], R=S.requests.find(z=>z.id===ui.view.id);
      R.signature={nom:S.company.dirNom,prenom:S.company.dirPrenom||'',fonction:S.company.dirFonction,date:todayISO(),method:'pdf'};
      await saveFile('r-'+R.id+'-o',f,'ORIGINAL-SIGNE_'+pdfName(R)); R.origId='r-'+R.id+'-o';
      const blob=await makeRequestPdf(Object.assign({},R,{company:S.company}), await pkgFull(R,{name:'ORIGINAL-SIGNE_'+pdfName(R),data:await blobToB64(f)}));
      await saveFile('r-'+R.id,fileOf(blob,pdfName(R)),pdfName(R)); R.pdfId='r-'+R.id; R.status='signee'; R.signedAt=nowISO();
      await persist(); render(); toast('PDF signé importé');
    }
  }catch(err){ console.error(err); toast('Erreur : '+err.message); }
});
document.addEventListener('keydown',e=>{ if(e.key==='Enter' && e.target.id==='pinIn') act('unlock',e.target,e); });
document.addEventListener('visibilitychange',()=>{ if(document.hidden) ui.hiddenAt=Date.now(); else if(S.settings.pinHash && ui.hiddenAt && Date.now()-ui.hiddenAt>60000 && !ui.locked){ ui.locked=true; closeModal(); render(); } });
window.addEventListener('resize',()=>{ if($('#sig')) initSig(); });

/* ---------- Démarrage ---------- */
(async()=>{
  await Store.open();
  try{ const saved=await Store.get('kv','S'); if(saved) S=Object.assign(defaultS(),saved); }catch(e){}
  ui.locked=!!S.settings.pinHash;
  await purge(); render();
  if(!Store.db) toast('Stockage local indisponible : les données ne seront pas conservées');
})();
</script>
</body>
